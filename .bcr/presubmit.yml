matrix:
  platform:
  - ubuntu2404
  - macos_arm64
  bazel:
  - 9.x
  - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--cxxopt=-std=c++17'
    - '--host_cxxopt=-std=c++17'
    build_targets:
    - '@gz-common'
    - '@gz-common//events:events'
    - '@gz-common//geospatial:geospatial'
    - '@gz-common//graphics:graphics'
    - '@gz-common//io:io'
    - '@gz-common//profiler:profiler'
    - '@gz-common//testing:testing'
